name: PR Policy

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest

    steps:
      - name: Validate source and target branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Source: $HEAD_REF"
          echo "Target: $BASE_REF"

          case "$HEAD_REF" in
            feature/*|chore/*|docs/*)
              if [ "$BASE_REF" != "dev" ]; then
                echo "::error::$HEAD_REF branches must target dev."
                exit 1
              fi
              ;;

            fix/*)
              if [[ "$HEAD_REF" =~ ^fix/([0-9]+\.[0-9]+\.[0-9]+)/.+$ ]]; then
                VERSION="${BASH_REMATCH[1]}"
                EXPECTED_TARGET="release/$VERSION"

                if [ "$BASE_REF" != "$EXPECTED_TARGET" ]; then
                  echo "::error::Release fix '$HEAD_REF' must target '$EXPECTED_TARGET'."
                  exit 1
                fi
              elif [ "$BASE_REF" != "dev" ]; then
                echo "::error::Regular fix branches must target dev."
                exit 1
              fi
              ;;

            hotfix/*)
              if [ "$BASE_REF" != "main" ]; then
                echo "::error::Hotfix branches must target main."
                exit 1
              fi
              ;;

            release-promotion/*)
              if [ "$BASE_REF" != "main" ]; then
                echo "::error::Release promotion branches must target main."
                exit 1
              fi

              if [[ ! "$HEAD_REF" =~ ^release-promotion/([0-9]+\.[0-9]+\.[0-9]+)/from-v([0-9]+\.[0-9]+\.[0-9]+)rc([1-9][0-9]*)$ ]]; then
                echo "::error::Invalid release promotion branch format: '$HEAD_REF'."
                exit 1
              fi

              VERSION="${BASH_REMATCH[1]}"
              RC_VERSION="${BASH_REMATCH[2]}"

              if [ "$VERSION" != "$RC_VERSION" ]; then
                echo "::error::Release version '$VERSION' does not match RC version '$RC_VERSION'."
                exit 1
              fi
              ;;

            release/*)
              echo "::error::Release branches must not be merged directly."
              echo "::error::Promote a tagged release candidate through a release-promotion/* branch."
              exit 1
              ;;

            mergeback/*)
              if [ "$BASE_REF" != "dev" ] && [[ ! "$BASE_REF" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Merge-back branches may only target dev or a release/x.y.z branch."
                exit 1
              fi
              ;;

            dev)
              if [[ ! "$BASE_REF" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::dev may only target an active release/x.y.z branch."
                exit 1
              fi
              ;;

            *)
              echo "::error::Unsupported source branch: '$HEAD_REF'."
              echo "Allowed sources: feature/*, fix/*, chore/*, docs/*, hotfix/*, release-promotion/*, mergeback/*, or dev."
              exit 1
              ;;
          esac

          echo "Branch policy passed."

  docs-policy:
    name: Documentation Scope
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'docs/')

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate documentation-only changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"

          CHANGED_FILES="$(git diff --name-only "origin/$BASE_REF...HEAD")"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          INVALID_FILES=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              docs/*|README.md|README.*.md|CONTRIBUTING.md|CODE_OF_CONDUCT.md|SECURITY.md|.github/PULL_REQUEST_TEMPLATE/*|.github/ISSUE_TEMPLATE/*)
                ;;
              *)
                INVALID_FILES="${INVALID_FILES}${file}"$'\n'
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ -n "$INVALID_FILES" ]; then
            echo "::error::docs/* branches may only modify documentation files."
            echo
            echo "Non-documentation changes detected:"
            echo "$INVALID_FILES"
            echo
            echo "Move these changes to an appropriate branch prefix, such as feature/, fix/, or chore/."
            exit 1
          fi

          echo "Documentation scope passed."
