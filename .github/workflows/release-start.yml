name: Start Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  start-release:
    name: Start Release
    runs-on: ubuntu-latest

    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must follow semantic version format: X.Y.Z"
            exit 1
          fi

          echo "release_branch=release/$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release bot token
        id: release-bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.release-bot.outputs.token }}

      - name: Ensure release branch does not already exist
        env:
          RELEASE_BRANCH: ${{ steps.version.outputs.release_branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "::error::Release branch '$RELEASE_BRANCH' already exists."
            exit 1
          fi

      - name: Ensure no active release exists
        run: |
          mapfile -t ACTIVE_RELEASES < <(
            git ls-remote --heads origin 'release/*' \
              | awk '{print $2}' \
              | sed 's#refs/heads/##'
          )

          if [ "${#ACTIVE_RELEASES[@]}" -gt 0 ]; then
            echo "::error::An active release already exists:"
            printf '%s\n' "${ACTIVE_RELEASES[@]}"
            exit 1
          fi

      - name: Create release branch from main
        env:
          RELEASE_BRANCH: ${{ steps.version.outputs.release_branch }}
        run: |
          git switch -c "$RELEASE_BRANCH"
          git push origin "$RELEASE_BRANCH"

      - name: Open release train pull request
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ steps.version.outputs.release_branch }}
        run: |
          gh pr create \
            --head dev \
            --base "$RELEASE_BRANCH" \
            --title "release: sync dev into $VERSION" \
            --body "Synchronizes the current \`dev\` snapshot into \`$RELEASE_BRANCH\`.

          Merge this pull request to include all changes currently available in \`dev\` in release \`$VERSION\`.

          ## Merge strategy

          Use **Merge pull request** for this PR instead of squash merge.

          This preserves the relationship between \`dev\` and the release branch so future synchronization PRs contain only new changes.

          ## Release candidate

          Merging this PR does not automatically create a release candidate.

          When the release branch reaches a candidate state, run the **Create Release Candidate** workflow to create an immutable RC snapshot.

          If \`dev\` advances after this PR is merged, a new synchronization PR will be opened automatically."
