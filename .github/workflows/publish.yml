name: Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Publish Release
    if: startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stable release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Resolve package version
        id: version
        run: |
          VERSION="$(
            python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              project = tomllib.load(file)

          print(project["project"]["version"])
          PY
          )"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable releases must use X.Y.Z format. Found: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          EXPECTED="release: v$VERSION"

          FIRST_LINE="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)"

          if [ "$FIRST_LINE" != "$EXPECTED" ]; then
            echo "::error::Expected release commit '$EXPECTED', found '$FIRST_LINE'."
            exit 1
          fi

      - name: Verify tag does not already exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' already exists."
            exit 1
          fi

      - name: Sync dependencies
        run: uv sync --locked

      - name: Build distributions
        run: uv build

      - name: Verify distributions
        run: |
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"

      - name: Test wheel installation
        run: |
          uv venv /tmp/trabeculai-release-test --python 3.13

          uv pip install \
            --python /tmp/trabeculai-release-test/bin/python \
            dist/*.whl

          /tmp/trabeculai-release-test/bin/python -c \
            "import trabeculai; print(trabeculai.__version__)"

      - name: Create stable tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "$TAG"
