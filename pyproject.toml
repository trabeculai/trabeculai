[project]
authors = [
  {name = "TrabeculAI contributors"},
]
dependencies = [
    "numpy<2",
    "pydantic>=2.13.4",
    "sentence-transformers==5.7.0",
    "torch==2.2.2",
    "transformers==4.57.6",
]
description = "Composable AI infrastructure for healthcare."
license = "Apache-2.0"
name = "trabeculai"
readme = "README.md"
requires-python = "~=3.12.0"
version = "0.1.0"

[dependency-groups]
dev = [
  "mypy",
  "pre-commit>=4.6.2",
  "pytest",
  "pytest-cov",
  "ruff",
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.3,<0.13"]

# ==========================================================
# Pytest
# ==========================================================

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: tests that use real external models or integrations",
]

# ==========================================================
# Ruff
# ==========================================================

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

# ==========================================================
# Mypy
# ==========================================================

[tool.mypy]
files = [
  "src",
  "tests",
]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "src"
